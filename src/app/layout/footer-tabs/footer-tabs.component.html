<footer class="app-footer">
  <div class="tabs">
    <div
      *ngFor="let tab of tabs"
      class="tab"
      [class.active]="activeTab === tab.name"
      (click)="setActiveTab(tab.name)"
    >
      <div class="tab-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path *ngIf="tab.icon === 'home'" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
          <path *ngIf="tab.icon === 'track_changes'" d="M19.07 4.93l-1.41 1.41C19.1 7.79 20 9.79 20 12c0 4.42-4.42 8-10 8s-8-3.58-8-8c0-4.42 3.58-8 8-8c1.85 0 3.55.63 4.9 1.69L15.5 6.5C14.71 5.97 13.39 5.5 12 5.5c-3.03 0-5.5 2.47-5.5 5.5s2.47 5.5 5.5 5.5c1.61 0 3.09-.69 4.11-1.79l1.41 1.41C16.21 16.89 14.21 17.5 12 17.5c-3.86 0-7-3.14-7-7s3.14-7 7-7c2.02 0 3.88.67 5.36 1.79z" fill="currentColor"/>
          <circle *ngIf="tab.icon === 'add'" cx="12" cy="12" r="10" fill="currentColor"/>
          <path *ngIf="tab.icon === 'add'" d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7z" fill="white"/>
          <path *ngIf="tab.icon === 'account_balance_wallet'" d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/>
          <path *ngIf="tab.icon === 'school'" d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z" fill="currentColor"/>
        </svg>
      </div>
      <div class="tab-label">{{ tab.name }}</div>
    </div>
  </div>
</footer>
