<div class="charts-container">
  <div class="chart-section">

    <div class="button-group">
      <button (click)="setChartTransactionType('expenses')" type="button">Gastos</button>
      <button (click)="setChartTransactionType('income')" type="button">Ingresos</button>
    </div>

    <canvas
      baseChart
      [data]="chartData"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>

  </div>
</div>
