<app-header></app-header>

<main class="main-content">
  <div class="main-blocks" [ngSwitch]="activeTab">
    <section class="gap-content" *ngSwitchCase="'Home'">
      <app-balance></app-balance>
      <app-transaction-history mode="home"></app-transaction-history>
      <app-register-button></app-register-button>
      <app-transaction-card
        *ngIf="unsyncedTransaction"
        [transaction]="unsyncedTransaction"
        [editable]="true"
        [transactionAction]="'Sincronize'"
        (transactionUpdated)="onTransactionSynced()">
      </app-transaction-card>
      <app-financial-literacy></app-financial-literacy>
    </section>
    <section class="gap-content" *ngSwitchCase="'Tracking'">
      <app-tracking-content></app-tracking-content>
    </section>
    <section class="gap-content" *ngSwitchCase="'Create'">
      <app-chat-content></app-chat-content>
    </section>
    <section class="gap-content" *ngSwitchCase="'Budgets'">
      <app-budget></app-budget>
    </section>
    <section class="gap-content" *ngSwitchCase="'Learning'">
      <app-learning-content></app-learning-content>
    </section>
  </div>
</main>

<app-footer-tabs></app-footer-tabs>
