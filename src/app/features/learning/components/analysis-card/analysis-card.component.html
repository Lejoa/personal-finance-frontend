<div class="analysis-card" [class.analysis-card--expanded]="isExpanded">
  <button class="analysis-card__header" (click)="toggleExpanded()" type="button">
    <div class="analysis-card__title-row">
      <span class="analysis-card__title">{{ title }}</span>
      @if (!analysis.isRead) {
        <span class="badge-new">NUEVO</span>
      }
    </div>
    <svg class="analysis-card__chevron" [class.analysis-card__chevron--open]="isExpanded"
         width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  @if (isExpanded) {
    <div class="analysis-card__body">
      <div class="analysis-card__content" [innerHTML]="analysis.content | markdown"></div>
      <p class="analysis-card__date">Generado el {{ formattedDate }}</p>
    </div>
  }
</div>
