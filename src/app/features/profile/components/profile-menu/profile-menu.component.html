@if (isOpen) {
  <div class="profile-menu__backdrop" (click)="close()" aria-hidden="true"></div>
}

<aside
  class="profile-menu"
  [class.profile-menu--open]="isOpen"
  role="dialog"
  aria-modal="true"
  aria-label="Menú de cuenta">

  <div class="profile-menu__header">
    <div class="profile-menu__avatar">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
      </svg>
    </div>
    <div class="profile-menu__user-info">
      @if (currentUser$ | async; as user) {
        <span class="profile-menu__name">{{ user.name }}</span>
        <span class="profile-menu__email">{{ user.email }}</span>
      } @else {
        <span class="profile-menu__email">Cargando...</span>
      }
    </div>
  </div>

  <div class="profile-menu__divider"></div>

  <nav class="profile-menu__nav">
    <div class="profile-menu__item profile-menu__item--clickable" (click)="openCategories()" role="button">
      <div class="profile-menu__item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" fill="currentColor"/>
        </svg>
      </div>
      <span class="profile-menu__item-label">Categorías</span>
      <svg class="profile-menu__item-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="profile-menu__item">
      <div class="profile-menu__item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1C5.925 1 1 5.925 1 12v3c0 1.103.897 2 2 2h1c1.103 0 2-.897 2-2v-3c0-3.859 3.141-7 7-7s7 3.141 7 7v3c0 1.103.897 2 2 2h1c1.103 0 2-.897 2-2v-3c0-6.075-4.925-11-11-11z" fill="currentColor"/>
        </svg>
      </div>
      <span class="profile-menu__item-label">Soporte</span>
      <svg class="profile-menu__item-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="profile-menu__item">
      <div class="profile-menu__item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="currentColor"/>
        </svg>
      </div>
      <span class="profile-menu__item-label">Acerca de</span>
      <svg class="profile-menu__item-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </nav>
</aside>
