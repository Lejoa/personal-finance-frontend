<div class="chat-container">
  <div class="chat-header">
    <h2 class="chat-title">Asistente Financiero</h2>
    <button
      class="clear-chat-btn"
      (click)="clearChat()"
      title="Limpiar conversación">
      🗑️
    </button>
  </div>

  <div class="messages-container" #messagesContainer>
    <div
      *ngFor="let message of chatState.messages"
      class="message-wrapper"
      [class.user-message]="message.type === 'user'"
      [class.bot-message]="message.type === 'bot'">
      <div class="message-bubble">
        <p class="message-content">{{ message.content }}</p>
        <span class="message-timestamp">{{ message.timestamp | date:'short' }}</span>
      </div>
    </div>

    <div *ngIf="chatState.isTyping" class="message-wrapper bot-message">
      <div class="message-bubble typing-indicator">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="chat-input-container">
    <input
      type="text"
      class="chat-input"
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Escribe tu mensaje aquí..."
      [disabled]="chatState.isTyping">
    <button
      class="send-btn"
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || chatState.isTyping">
      ➤
    </button>
  </div>
</div>
