<div class="tool-card" [class.tool-card--open]="isExportPanelOpen">

  <button
    class="tool-card__header"
    type="button"
    (click)="toggleExportPanel()"
    [attr.aria-expanded]="isExportPanelOpen">
    <div class="tool-card__icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 2v6h6M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tool-card__info">
      <span class="tool-card__name">Exportar CSV</span>
      <span class="tool-card__desc">Descarga tus transacciones como archivo Excel-compatible</span>
    </div>
    <svg
      class="tool-card__chevron"
      width="18" height="18" viewBox="0 0 24 24" fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (isExportPanelOpen) {
    <div class="tool-card__panel">

      <div class="export-field">
        <label class="export-field__label" for="export-type">Tipo</label>
        <select
          id="export-type"
          class="export-field__select"
          [(ngModel)]="selectedType"
          (ngModelChange)="onTypeChange()">
          <option value="todos">Todos</option>
          <option value="gasto">Gastos</option>
          <option value="ingreso">Ingresos</option>
        </select>
      </div>

      <div class="export-field">
        <label class="export-field__label" for="export-category">Categoría</label>
        <select
          id="export-category"
          class="export-field__select"
          [(ngModel)]="selectedCategoryId">
          <option value="">Todas las categorías</option>
          @for (cat of getCategoriesForType(); track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <div class="export-field">
        <label class="export-field__label" for="export-start">Desde</label>
        <input
          id="export-start"
          type="date"
          class="export-field__input"
          [(ngModel)]="startDate" />
      </div>

      <div class="export-field">
        <label class="export-field__label" for="export-end">Hasta</label>
        <input
          id="export-end"
          type="date"
          class="export-field__input"
          [(ngModel)]="endDate" />
      </div>

      @if (errorMessage) {
        <div class="export-error" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <button
        class="export-btn"
        type="button"
        (click)="exportCsv()"
        [disabled]="isLoading">
        @if (isLoading) {
          <svg class="export-btn__spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
          </svg>
          Descargando...
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 16l-4-4h3V4h2v8h3l-4 4z" fill="currentColor"/>
            <path d="M20 18H4v2h16v-2z" fill="currentColor"/>
          </svg>
          Exportar
        }
      </button>

    </div>
  }
</div>
