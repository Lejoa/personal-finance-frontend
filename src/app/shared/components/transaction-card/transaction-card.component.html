<div class="transaction-card">
    <button
            *ngIf="editable && !isEditing"
            class="edit-button"
            (click)="startEdit()"
            title="Editar transacción"
            type="button">
            Editar
    </button>
    <!-- Read Mode -->
    <div class="transaction-header">
        <span class="transaction-name">{{ transaction.name }}</span>
        <span class="transaction-amount">{{ transaction.amount |  
        currency:'COP':'symbol-narrow':'1.0-0' }}</span>
    </div>
    <div class="transaction-footer">
        <span class="transaction-date">{{transaction.date | date:'fullDate'}}</span>
        <div class="category-badges">
            <span class="category-badge">{{ transaction.category }}</span>
        </div>
    </div>
</div>

<!-- Modal Overlay for Edit Mode -->
<div *ngIf="isEditing" class="edit-overlay">
    <div class="edit-modal">
        <h3 class="modal-title">Editar Transacción</h3>

        <div class="edit-form">
            <div class="form-group">
                <label for="edit-name">Nombre</label>
                <input
                    id="edit-name"
                    type="text"
                    [(ngModel)]="editName"
                    class="form-input"
                    placeholder="Ingrese el nombre"
                >
            </div>

            <div class="form-group">
                <label for="edit-amount">Monto</label>
                <input
                    id="edit-amount"
                    type="number"
                    [(ngModel)]="editAmount"
                    class="form-input"
                    placeholder="Ingrese el monto"
                >
            </div>

            <div class="form-group">
                <label for="edit-date">Fecha</label>
                <input
                    id="edit-date"
                    type="text"
                    [(ngModel)]="editDate"
                    class="form-input"
                    placeholder="Ingrese la fecha"
                >
            </div>

            <div class="form-group">
                <label for="edit-category">Categoría</label>
                <mat-form-field>
                    <mat-label>Categorías</mat-label>
                        <mat-select [formControl]="categories" multiple>
                        <mat-option *ngFor="let category of categoryList" [value]="category">
                            {{category}}
                        </mat-option>
                        </mat-select>
                </mat-form-field>
            </div>

            <div class="form-actions">
                <button
                    class="btn-save"
                    (click)="saveEdit()"
                    type="button">
                    Guardar
                </button>
                <button
                    class="btn-cancel"
                    (click)="cancelEdit()"
                    type="button">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>
