<header class="app-header">
  <div class="header-content">
    <div class="left-icon" role="button" tabindex="0" aria-label="Abrir menú de cuenta"
      (click)="onProfileClick()" (keydown.enter)="onProfileClick()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
      </svg>
    </div>
    <h2>{{ activeTabLabel$ | async }}</h2>
    <div class="right-icon" role="button" tabindex="0" aria-label="Notificaciones"
      (click)="onBellClick()" (keydown.enter)="onBellClick()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/>
      </svg>
      @if (unreadCount$ | async; as count) {
        <span class="badge">{{ count }}</span>
      }
    </div>
  </div>
</header>

<app-profile-menu
  [isOpen]="(isMenuOpen$ | async) ?? false"
  (menuClosed)="closeMenu()"
  (categoriesClicked)="onCategoriesClicked()">
</app-profile-menu>
