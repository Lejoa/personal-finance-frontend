<footer class="footer-tabs">
  @for (tab of tabs; track tab.name) {
    <button
      (click)="onTabChange(tab.name)"
      [class.active]="activeTab === tab.name"
      type="button"
    >
      <div class="tab-icon">
        @if (tab.icon === 'home') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
          </svg>
        }
        @if (tab.icon === 'pie_chart') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 2.05V13h10.95A10.001 10.001 0 0 0 11 2.05z" fill="currentColor" opacity="0.6"/>
            <path d="M13 2.05V11h8.95A10.001 10.001 0 0 0 13 2.05zM2 12c0 5.19 3.95 9.45 9 9.95V12H2zm11 9.95c2.24-.26 4.27-1.25 5.84-2.74L13 14.17V21.95z" fill="currentColor"/>
            <path d="M11 2.05C5.95 2.55 2 6.81 2 12h9V2.05z" fill="currentColor"/>
          </svg>
        }
        @if (tab.icon === 'account_balance_wallet') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/>
          </svg>
        }
        @if (tab.icon === 'school') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z" fill="currentColor"/>
          </svg>
        }
        @if (tab.icon === 'build') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" fill="currentColor"/>
          </svg>
        }
      </div>
      <span class="tab-label">{{ tab.label }}</span>
    </button>
  }
</footer>
