name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: finance-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Verify Nginx starts
        run: |
          docker run -d --name frontend-ci -p 8080:8080 finance-frontend:ci
          sleep 3
          curl -sf http://localhost:8080 && echo "OK" || (docker logs frontend-ci && exit 1)
