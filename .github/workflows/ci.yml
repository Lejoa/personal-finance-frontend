name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

  build-android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      -
        name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      -
        name: Install dependencies
        run: npm ci
      -
        name: Build Angular (android config)
        run: npm run build:android
      -
        name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      -
        name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      -
        name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
      -
        name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-debug-${{ github.sha }}
          path: /tmp/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: finance-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Verify Nginx starts
        run: |
          docker run -d --name frontend-ci -p 8080:8080 finance-frontend:ci
          sleep 3
          curl -sf http://localhost:8080 && echo "OK" || (docker logs frontend-ci && exit 1)
